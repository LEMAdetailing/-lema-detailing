<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEMA Detailing</title>
<style>
:root{--bg:#F8F6F1;--sf:#fff;--ink:#101828;--mute:#4A5568;--navy:#0B1F4B;--gold:#9A7020;--gl:#C9A15A;--line:#E3DDD0;--on:#F8F6F1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--sf:#111B36;--ink:#F3F0E8;--mute:#B4BCCF;--navy:#C9A15A;--gold:#D9B26A;--line:#24325A;--on:#0A1226}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Arial,sans-serif}
.w{max-width:520px;margin:0 auto;padding:0 18px 36px}
header{text-align:center;padding:18px 0 4px}
header img{width:200px;max-width:65%;border-radius:10px;background:#fff}
.tag{text-align:center;color:var(--mute);margin:8px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:118px;padding:14px;background:var(--sf);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;font:inherit;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;text-align:center}
.t:active{transform:scale(.97)}
.t svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.t.p{background:var(--navy);color:var(--on);border-color:var(--navy)}.t.p svg{stroke:var(--on)}
.t.wide{grid-column:1/-1}
.back{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;padding:10px 0;cursor:pointer;margin-bottom:6px}
h2{font-size:26px;margin:0 0 8px;line-height:1.15}
.c{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.c h3{margin:0 0 4px;font-size:18px}.c b.pr{color:var(--gold)}
.c ul{margin:6px 0 0;padding-left:20px;color:var(--mute)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:8px;padding:12px}
.btn{display:block;background:var(--navy);color:var(--on);border-radius:999px;padding:14px;font-weight:600;text-decoration:none;text-align:center;margin-top:16px}
.err{color:#B3261E;min-height:1.2em;font-size:14px;margin:8px 0 0}
@media (prefers-color-scheme:dark){.err{color:#FF8A80}}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.s{aspect-ratio:1;border-radius:50%;border:2px dashed var(--gl);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:15px}
.s.f{background:var(--navy);border:2px solid var(--navy);color:var(--on)}.s.g{border:2px solid var(--gold);font-size:10px}
.m{padding:12px;border-radius:8px;background:var(--navy);color:var(--on);font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}.row .i{flex:1;min-width:140px}.row small{color:var(--mute);display:block}.bs{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:8px 14px;border:1.5px solid var(--gold);background:transparent;color:var(--ink);cursor:pointer}.bs.p{background:var(--navy);color:var(--on);border-color:var(--navy)}.ow{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:10px;grid-column:1/-1}
.tb{width:100%;border-collapse:collapse;margin-top:10px}.tb td{padding:7px 0;border-top:1px solid var(--line)}.tb td:last-child{text-align:right;color:var(--gold)}.pre{font-weight:600;color:var(--gold);margin:12px 0 0}
[hidden]{display:none!important}
.sm{color:var(--mute);font-size:14px}
</style></head><body><div class="w">
